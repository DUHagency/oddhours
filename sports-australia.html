<script>
(function () {
  var SALT = "oddhours-gate-v1|", ROUNDS = 310000, STORE = 'oh-gate-key';
  var data = JSON.parse(document.getElementById('gate-data').textContent);
  var enc = new TextEncoder(), dec = new TextDecoder();
  function bytes(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function b64(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function derive(user, pass) {
    return crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']).then(function (k) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: enc.encode(SALT + user.trim().toLowerCase()), iterations: ROUNDS, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
  }
  // document.open() replaces the document only once the stub has finished
  // LOADING (not just parsing): written any earlier, Chrome appends the page
  // under the form instead of replacing it — seen on the saved-key path, which
  // runs before the stylesheet and the mark have arrived. So wait for load.
  function ready() { return document.readyState === 'complete' ? Promise.resolve() : new Promise(function (r) { window.addEventListener('load', r, { once: true }); }); }
  function open(key) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(data.iv) }, key, bytes(data.ct)).then(function (pt) {
      var html = dec.decode(pt);
      return ready().then(function () { document.open(); document.write(html); document.close(); });
    });
  }
  function keep(key) { return crypto.subtle.exportKey('raw', key).then(function (raw) { try { sessionStorage.setItem(STORE, b64(new Uint8Array(raw))); } catch (e) {} }); }
  var saved = null; try { saved = sessionStorage.getItem(STORE); } catch (e) {}
  if (saved) {
    crypto.subtle.importKey('raw', bytes(saved), { name: 'AES-GCM' }, true, ['decrypt']).then(open).catch(function () { try { sessionStorage.removeItem(STORE); } catch (e) {} });
  }
  document.getElementById('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var no = document.getElementById('no'); no.classList.remove('on');
    var btn = ev.target.querySelector('button'); btn.disabled = true;
    derive(document.getElementById('u').value, document.getElementById('p').value)
      .then(function (key) { return keep(key).then(function () { return open(key); }); })
      .catch(function () { no.classList.add('on'); btn.disabled = false; document.getElementById('p').value = ''; document.getElementById('p').focus(); });
  });
})();
</script>
