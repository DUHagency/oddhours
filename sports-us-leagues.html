    crypto.subtle.importKey('raw', bytes(saved), { name: 'AES-GCM' }, true, ['decrypt']).then(open).catch(function () { try { sessionStorage.removeItem(STORE); } catch (e) {} });
  }
  document.getElementById('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var no = document.getElementById('no'); no.classList.remove('on');
    var btn = ev.target.querySelector('button'); btn.disabled = true;
    derive(document.getElementById('u').value, document.getElementById('p').value)
      .then(function (key) { return keep(key).then(function () { return open(key); }); })
      .catch(function () { no.classList.add('on'); btn.disabled = false; document.getElementById('p').value = ''; document.getElementById('p').focus(); });
  });
})();
</script>
</body>
