<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Store — Odd Hours Bakehouse</title>
<link rel="icon" href="img/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<style>
.gate { max-width: 26rem; margin: 10vh auto 3rem; padding: 0 16px; }
.gate h1 { margin: .6rem 0 .2rem; }
.gate p { color: var(--muted); margin: 0 0 1.2rem; }
.gate label { display: block; margin: .8rem 0 .25rem; font-weight: 600; }
.gate input { width: 100%; padding: .6rem .7rem; font: inherit; color: var(--ink); background: var(--panel); border: 2px solid var(--line); }
.gate input:focus { outline: 2px solid var(--brass); outline-offset: 2px; border-color: var(--brass); }
.gate button { margin-top: 1.1rem; padding: .65rem 1.2rem; font: inherit; font-weight: 700; color: var(--ground); background: var(--brass); border: 2px solid var(--brass); cursor: pointer; }
.gate button:hover, .gate button:focus-visible { background: var(--ink); border-color: var(--ink); }
.gate .no { display: none; margin-top: .9rem; padding: .6rem .8rem; border: 2px solid var(--chip); color: var(--ink); }
.gate .no.on { display: block; }
.gate .mark { width: 56px; height: 56px; display: block; }
</style>
</head>
<body>
<main class="gate" id="gate">
  <img class="mark" src="img/mark.svg" alt="">
  <h1>Odd Hours Bakehouse</h1>
  <p>Locked while the pages are in draft. Sign in to read.</p>
  <form id="f" autocomplete="on">
    <label for="u">User</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Unlock</button>
    <p class="no" id="no" role="alert">That isn't it.</p>
  </form>
  <noscript><p>This page needs JavaScript to unlock.</p></noscript>
</main>
