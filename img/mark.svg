<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Odd Hours Bakehouse">
  <!-- Odd Hours Bakehouse: the mark, drawn 2026-10-16 (brand/README.md § The logo).
       A round loaf in brass on the walnut board of a scoreboard tile, scored like
       a clock reading three, the baker's hour. The hands are cuts in the crust, so
       the shape reads without its colour. Blue never leads in any colour here. -->
  <rect x="1" y="1" width="30" height="30" rx="3" fill="#19130c" stroke="#e8a838" stroke-width="2"/>
  <circle cx="16" cy="16" r="10.5" fill="#e8a838"/>
  <circle cx="16" cy="16" r="10.5" fill="none" stroke="#8a5a14" stroke-width="1.5"/>
  <path d="M16 16V9.5M16 16h6" fill="none" stroke="#19130c" stroke-width="2.6" stroke-linecap="round"/>
  <rect x="14.7" y="14.7" width="2.6" height="2.6" fill="#19130c"/>
</svg>
